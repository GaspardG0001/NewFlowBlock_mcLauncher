name: Build

on:
  push:
    branches: [ "main", "action/add-build-action" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: 22
              cache: npm

          - name: Install dependencies
            run: npm ci

          - name: Build for Windows
            run: npm run release:win

          - name: Upload build
            uses: actions/upload-artifact@v4
            with:
              name: windows-build
              if-no-files-found: error
              path: |
                release/*.exe
                release/*.blockmap
                release/latest.yml
                release-msix/*.msix